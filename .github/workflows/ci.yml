# CI — no secrets needed. Typecheck, lint, the offline test suite (+ coverage),
# a production `next build` and the Playwright smoke suite against it, plus the
# database checks against a throwaway Postgres. Nothing here talks to Swiggy or
# an LLM: the build and the E2E server run on dummy env values.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  # dummy, non-secret values: the build and the smoke server never hold a real session
  APP_BASE_URL: http://localhost:3200
  SESSION_SECRET: ci-dummy-session-secret-not-for-production-0000
  SWIGGY_OAUTH_CLIENT_ID: swiggy-mcp
  SWIGGY_ENABLE_ORDERS: "false"

jobs:
  quality:
    name: Typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Unit + component + API tests (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;const r=k=>t[k].pct+'%';console.log('| lines | statements | functions | branches |\n|---|---|---|---|\n| '+[r('lines'),r('statements'),r('functions'),r('branches')].join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: next build + Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_DIST_DIR: .next-e2e
      E2E_PORT: "3200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next-e2e/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: next build (production, dummy env)
        run: npx next build
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke (production server on :3200)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  db:
    name: Database checks (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: swizzo
          POSTGRES_PASSWORD: swizzo
          POSTGRES_DB: swizzo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swizzo -d swizzo"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://swizzo:swizzo@localhost:5432/swizzo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:verify
