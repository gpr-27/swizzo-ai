# Local Postgres for development: `npm run db:up` then `npm run db:migrate`.
# DATABASE_URL=postgres://swizzo:swizzo@localhost:5433/swizzo
# (5433 so it never collides with a Postgres already on 5432.)
services:
  postgres:
    image: postgres:17-alpine
    container_name: swizzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swizzo
      POSTGRES_PASSWORD: swizzo
      POSTGRES_DB: swizzo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - swizzo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swizzo -d swizzo"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  swizzo-pgdata:
